<header class="site-header" role="banner">
  <div class="wrapper header-inner">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}" aria-label="Emmanuel Randle, home">
      <span class="brand-mark" aria-hidden="true">ER</span>
      <span class="brand-copy">
        <span>Emmanuel Randle</span>
        <small>Catastrophe risk researcher</small>
      </span>
    </a>

    <nav class="site-nav" aria-label="Primary navigation">
      <input type="checkbox" id="nav-trigger" class="nav-trigger" />
      <label for="nav-trigger" aria-label="Open navigation menu">
        <span class="menu-icon">
          <svg viewBox="0 0 18 15" width="18" height="15" aria-hidden="true">
            <path d="M18,1.5c0,0.8-0.7,1.5-1.5,1.5h-15C0.7,3,0,2.3,0,1.5S0.7,0,1.5,0h15C17.3,0,18,0.7,18,1.5z M18,7.5C18,8.3,17.3,9,16.5,9h-15C0.7,9,0,8.3,0,7.5S0.7,6,1.5,6h15C17.3,6,18,6.7,18,7.5z M18,13.5c0,0.8-0.7,1.5-1.5,1.5h-15C0.7,15,0,14.3,0,13.5S0.7,12,1.5,12h15C17.3,12,18,12.7,18,13.5z"/>
          </svg>
        </span>
      </label>

      <div class="trigger">
        <a class="page-link{% if page.url == '/projects/' or page.url contains '/projects/' %} is-active{% endif %}" href="{{ "/projects/" | relative_url }}">Projects</a>
        <a class="page-link{% if page.url == '/research/' %} is-active{% endif %}" href="{{ "/research/" | relative_url }}">Research</a>
        <a class="page-link{% if page.url == '/presentations/' %} is-active{% endif %}" href="{{ "/presentations/" | relative_url }}">Presentations</a>
        <a class="page-link{% if page.url == '/awards/' %} is-active{% endif %}" href="{{ "/awards/" | relative_url }}">Awards</a>
        <a class="page-link{% if page.url == '/about/' %} is-active{% endif %}" href="{{ "/about/" | relative_url }}">About</a>
      </div>
    </nav>
  </div>
</header>
