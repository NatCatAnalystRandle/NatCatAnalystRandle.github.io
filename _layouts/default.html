<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
    <meta name="author" content="Emmanuel Randle">
    <meta name="theme-color" content="#f8f6f1">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Emmanuel Randle",
        "url": "{{ '/' | absolute_url }}",
        "jobTitle": "Doctoral Researcher in Civil Engineering",
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "Oregon State University"
        },
        "alumniOf": [
          {"@type": "CollegeOrUniversity", "name": "Durham University"},
          {"@type": "CollegeOrUniversity", "name": "University of Lagos"}
        ],
        "sameAs": [
          "https://github.com/NatCatAnalystRandle",
          "https://www.linkedin.com/in/emmanuel-randle/"
        ],
        "knowsAbout": [
          "Catastrophe risk modeling",
          "Earthquake engineering",
          "Tsunami risk",
          "Spatial correlation",
          "Insurance and reinsurance analytics",
          "Community resilience"
        ]
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main" class="site-main" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
